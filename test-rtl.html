<!DOCTYPE html>
<html dir="rtl">
<head>
<style>
  body { margin: 0; }
  .container { width: 100%; height: 100vh; overflow: hidden; background: #eee; }
  .wrap { width: 300vw; display: flex; direction: ltr; }
  .panel { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 5rem; }
  .p1 { background: red; }
  .p2 { background: green; }
  .p3 { background: blue; }
</style>
</head>
<body>
  <div class="container">
    <div class="wrap">
      <div class="panel p1">1</div>
      <div class="panel p2">2</div>
      <div class="panel p3">3</div>
    </div>
  </div>
</body>
</html>
